<!-- Starfield background - multi-layer parallax stars -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" width="1440" height="810">
  <rect width="1440" height="810" fill="#020208"/>
  <!-- Layer 1: many small faint stars -->
  <g fill="#ffffff" fill-opacity="0.5">
    <circle cx="30" cy="50" r="0.5"/>
    <circle cx="120" cy="80" r="0.7"/>
    <circle cx="200" cy="120" r="0.4"/>
    <circle cx="300" cy="40" r="0.6"/>
    <circle cx="400" cy="100" r="0.5"/>
    <circle cx="550" cy="60" r="0.8"/>
    <circle cx="620" cy="140" r="0.4"/>
    <circle cx="700" cy="80" r="0.6"/>
    <circle cx="800" cy="30" r="0.7"/>
    <circle cx="900" cy="120" r="0.5"/>
    <circle cx="1000" cy="70" r="0.4"/>
    <circle cx="1100" cy="50" r="0.6"/>
    <circle cx="1200" cy="90" r="0.5"/>
    <circle cx="1300" cy="40" r="0.7"/>
    <circle cx="1400" cy="110" r="0.5"/>
    <circle cx="50" cy="200" r="0.4"/>
    <circle cx="150" cy="220" r="0.6"/>
    <circle cx="250" cy="190" r="0.5"/>
    <circle cx="350" cy="210" r="0.7"/>
    <circle cx="450" cy="180" r="0.4"/>
    <circle cx="550" cy="230" r="0.6"/>
    <circle cx="650" cy="200" r="0.8"/>
    <circle cx="750" cy="170" r="0.5"/>
    <circle cx="850" cy="210" r="0.4"/>
    <circle cx="950" cy="190" r="0.6"/>
    <circle cx="1050" cy="220" r="0.5"/>
    <circle cx="1150" cy="180" r="0.7"/>
    <circle cx="1250" cy="200" r="0.4"/>
    <circle cx="1350" cy="170" r="0.6"/>
  </g>
  <!-- Layer 2: medium stars -->
  <g fill="#80aaff" fill-opacity="0.7">
    <circle cx="100" cy="400" r="1"/>
    <circle cx="250" cy="350" r="1.2"/>
    <circle cx="400" cy="420" r="0.8"/>
    <circle cx="550" cy="380" r="1"/>
    <circle cx="700" cy="410" r="1.3"/>
    <circle cx="850" cy="370" r="0.9"/>
    <circle cx="1000" cy="430" r="1.1"/>
    <circle cx="1150" cy="390" r="1.2"/>
    <circle cx="1280" cy="400" r="0.8"/>
  </g>
  <!-- Layer 3: few bright stars -->
  <g fill="#b3d9ff" fill-opacity="0.9">
    <circle cx="200" cy="600" r="1.5"/>
    <circle cx="500" cy="550" r="1.8"/>
    <circle cx="800" cy="590" r="1.6"/>
    <circle cx="1100" cy="570" r="1.7"/>
    <circle cx="1300" cy="580" r="1.4"/>
  </g>
</svg>
