<!-- Shield bubble - concentric rings -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 40 40" width="320" height="320">
  <circle cx="0" cy="0" r="16" fill="none" stroke="#00e0ff" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="0" cy="0" r="18" fill="none" stroke="#00aaff" stroke-width="1" stroke-opacity="0.2"/>
  <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="3s" repeatCount="indefinite"/>
</svg>
